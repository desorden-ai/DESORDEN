<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="DESORDEN — creación audiovisual, dron, web e inteligencia artificial.">
  <title>DESORDEN | Impacto visual</title>
  <style>
    :root {
      --yellow: #ebb221;
      --black: #000;
      --safe-top: max(20px, env(safe-area-inset-top));
      --safe-bottom: max(22px, env(safe-area-inset-bottom));
    }

    * { box-sizing: border-box; }

    html {
      background: var(--black);
      color-scheme: dark;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      overflow-x: hidden;
      background: var(--black);
      color: var(--yellow);
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .experience {
      position: relative;
      min-height: 300svh;
      background: var(--black);
    }

    .stage {
      position: sticky;
      top: 0;
      height: 100svh;
      min-height: 560px;
      overflow: hidden;
      background: var(--black);
      isolation: isolate;
    }

    .media {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      opacity: 0;
      transform: scale(1.015);
      transition: opacity .65s ease, transform 1.1s ease;
    }

    .media.active {
      opacity: 1;
      transform: scale(1);
    }

    .veil {
      position: absolute;
      inset: 0;
      z-index: 1;
      background:
        linear-gradient(180deg, rgba(0, 0, 0, .14) 0%, rgba(0, 0, 0, .06) 43%, rgba(0, 0, 0, .9) 100%),
        linear-gradient(90deg, rgba(0, 0, 0, .28), transparent 55%);
      pointer-events: none;
    }

    .topline {
      position: absolute;
      z-index: 3;
      top: var(--safe-top);
      left: 18px;
      right: 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      overflow: hidden;
      color: var(--yellow);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    .topline::after {
      content: "";
      flex: 0 0 24px;
      height: 24px;
      background: var(--yellow);
    }

    .marquee {
      flex: 1;
      overflow: hidden;
      white-space: nowrap;
    }

    .marquee span {
      display: inline-block;
      min-width: max-content;
      animation: marquee 14s linear infinite;
    }

    @keyframes marquee {
      from { transform: translateX(100%); }
      to { transform: translateX(-100%); }
    }

    .copy {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: calc(var(--safe-top) + 44px) 18px var(--safe-bottom);
      pointer-events: none;
    }

    .brand {
      margin: 0;
      width: min-content;
      color: var(--yellow);
      font-size: clamp(68px, 22vw, 170px);
      font-weight: 1000;
      line-height: .74;
      letter-spacing: -.075em;
      text-transform: uppercase;
      text-shadow: 0 2px 24px rgba(0, 0, 0, .18);
    }

    .brand span { display: block; }

    .message {
      align-self: flex-end;
      width: min(90vw, 740px);
      text-align: right;
    }

    .message h2 {
      margin: 0;
      color: var(--yellow);
      font-size: clamp(34px, 9.5vw, 82px);
      font-weight: 1000;
      line-height: .88;
      letter-spacing: -.045em;
      text-transform: uppercase;
    }

    .message p {
      margin: 13px 0 0;
      color: var(--yellow);
      font-size: clamp(13px, 3.7vw, 22px);
      font-weight: 900;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .hint {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 15px;
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .18em;
      text-transform: uppercase;
      opacity: .82;
    }

    .hint::after {
      content: "↓";
      color: var(--yellow);
      font-size: 18px;
      animation: bounce 1.5s ease-in-out infinite;
    }

    @keyframes bounce {
      50% { transform: translateY(5px); }
    }

    .fallback {
      position: fixed;
      z-index: 20;
      left: 12px;
      bottom: 12px;
      max-width: calc(100vw - 24px);
      margin: 0;
      padding: 8px 10px;
      border: 1px solid rgba(255, 255, 255, .18);
      background: rgba(0, 0, 0, .76);
      color: #fff;
      font-size: 11px;
      backdrop-filter: blur(10px);
    }

    .fallback[hidden] { display: none; }

    @media (min-width: 900px) {
      .topline { left: 42px; right: 42px; }
      .copy { padding-left: 42px; padding-right: 42px; }
      .brand { font-size: min(13vw, 176px); }
      .message { width: min(62vw, 780px); }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .media, .marquee span, .hint::after { animation: none; transition: none; }
    }
  </style>
</head>
<body>
  <main id="experience" class="experience">
    <section class="stage" aria-label="Presentación de DESORDEN">
      <video id="hero" class="media active" muted playsinline loop preload="metadata" poster="1000091026.jpg">
        <source src="video_20260724_005904.mp4" type="video/mp4">
      </video>

      <video id="manifesto" class="media" muted playsinline loop preload="metadata" poster="1000091026.jpg">
        <source src="video_20260724_005846.mp4" type="video/mp4">
      </video>

      <img id="author" class="media" src="1000091026.jpg" alt="David Milla, director de DESORDEN">

      <div class="veil"></div>

      <header class="topline">
        <div class="marquee">
          <span>DESCUBRIR · ORDENAR · DENOTAR · DESCUBRIR · ORDENAR · DENOTAR ·</span>
        </div>
      </header>

      <div class="copy">
        <h1 class="brand" aria-label="DESORDEN">
          <span>DES</span><span>OR</span><span>DEN</span>
        </h1>

        <div class="message" aria-live="polite">
          <h2 id="headline">Creo impacto visual</h2>
          <p id="caption">Vídeo · Dron · IA · Web</p>
          <span class="hint">Desliza para continuar</span>
        </div>
      </div>
    </section>
  </main>

  <p id="fallback" class="fallback" hidden>Contenido visual disponible en modo de compatibilidad.</p>

  <script>
    (() => {
      const items = [
        {
          element: document.getElementById("hero"),
          headline: "Creo impacto visual",
          caption: "Vídeo · Dron · IA · Web"
        },
        {
          element: document.getElementById("manifesto"),
          headline: "Acción directa",
          caption: "Cero burocracia · 100% ejecución"
        },
        {
          element: document.getElementById("author"),
          headline: "El motor humano",
          caption: "Dirección de arte · Ejecución técnica"
        }
      ];

      const headline = document.getElementById("headline");
      const caption = document.getElementById("caption");
      const fallback = document.getElementById("fallback");
      let activeIndex = -1;
      let ticking = false;

      function activate(index) {
        if (index === activeIndex) return;
        activeIndex = index;

        items.forEach((item, itemIndex) => {
          const active = itemIndex === index;
          item.element.classList.toggle("active", active);

          if (item.element.tagName === "VIDEO") {
            if (active) item.element.play().catch(() => {});
            else item.element.pause();
          }
        });

        headline.textContent = items[index].headline;
        caption.textContent = items[index].caption;
      }

      function update() {
        const maxScroll = Math.max(1, document.documentElement.scrollHeight - innerHeight);
        const progress = Math.min(1, Math.max(0, scrollY / maxScroll));
        activate(Math.min(items.length - 1, Math.floor(progress * items.length)));
        ticking = false;
      }

      function requestUpdate() {
        if (ticking) return;
        ticking = true;
        requestAnimationFrame(update);
      }

      document.querySelectorAll("video").forEach((video) => {
        video.addEventListener("error", () => {
          fallback.hidden = false;
        }, { once: true });
      });

      addEventListener("scroll", requestUpdate, { passive: true });
      addEventListener("resize", requestUpdate, { passive: true });
      update();
    })();
  </script>
</body>
</html>
