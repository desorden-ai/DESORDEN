name: Deploy DESORDEN to Cloudflare Workers

on:
  push:
    branches:
      - DESORDEN
  workflow_dispatch:

concurrency:
  group: desorden-production
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run V4 smoke tests
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee tests.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Deploy Worker and apply route
        id: deploy
        continue-on-error: true
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ERROR: GitHub secret CLOUDFLARE_API_TOKEN is not configured." | tee deploy.log
            status=78
          elif [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ERROR: GitHub secret CLOUDFLARE_ACCOUNT_ID is not configured." | tee deploy.log
            status=78
          else
            npx wrangler deploy 2>&1 | tee deploy.log
            status=${PIPESTATUS[0]}
          fi
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verify public endpoints
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set +e
          sleep 12
          : > verify.log
          status=0

          check_url() {
            label="$1"
            url="$2"
            expected="$3"
            code=$(curl --location --silent --show-error --max-time 25 \
              --header 'Cache-Control: no-cache' \
              --output /tmp/desorden-check \
              --write-out '%{http_code}' \
              "$url?deployment=${GITHUB_SHA}" 2>>verify.log)
            curl_status=$?

            if [ "$curl_status" -ne 0 ] || [ "$code" != "$expected" ]; then
              printf 'FAIL | %s | HTTP %s | %s\n' "$label" "$code" "$url" >> verify.log
              status=1
            else
              printf 'OK   | %s | HTTP %s | %s\n' "$label" "$code" "$url" >> verify.log
            fi
          }

          check_url 'Worker health' 'https://final.desorden-help-76b.workers.dev/health.json' '200'
          check_url 'Public health' 'https://www.desorden.cat/health.json' '200'
          check_url 'First frame' 'https://www.desorden.cat/frames/v1/frame_0001.webp' '200'
          check_url 'Last frame' 'https://www.desorden.cat/frames/v1/frame_0097.webp' '200'
          check_url 'Public homepage' 'https://www.desorden.cat/' '200'

          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish deployment report
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_EXIT: ${{ steps.tests.outputs.exit_code }}
          DEPLOY_EXIT: ${{ steps.deploy.outputs.exit_code }}
          VERIFY_EXIT: ${{ steps.verify.outputs.exit_code }}
        run: |
          {
            echo "## Despliegue automático"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Rama: \`${GITHUB_REF_NAME}\`"
            echo "- Pruebas: \`${TEST_EXIT:-desconocido}\`"
            echo "- Wrangler: \`${DEPLOY_EXIT:-desconocido}\`"
            echo "- Verificación HTTP: \`${VERIFY_EXIT:-desconocido}\`"
            echo
            echo "### Resultado de Wrangler"
            echo '```text'
            tail -n 120 deploy.log 2>/dev/null || echo 'Sin registro de despliegue.'
            echo '```'
            echo
            echo "### Comprobaciones públicas"
            echo '```text'
            cat verify.log 2>/dev/null || echo 'Sin registro de verificación.'
            echo '```'
          } > deployment-report.md

          gh issue comment 2 --repo "$GITHUB_REPOSITORY" --body-file deployment-report.md

      - name: Enforce deployment result
        if: always()
        shell: bash
        env:
          TEST_EXIT: ${{ steps.tests.outputs.exit_code }}
          DEPLOY_EXIT: ${{ steps.deploy.outputs.exit_code }}
          VERIFY_EXIT: ${{ steps.verify.outputs.exit_code }}
        run: |
          test "${TEST_EXIT:-1}" = "0"
          test "${DEPLOY_EXIT:-1}" = "0"
          test "${VERIFY_EXIT:-1}" = "0"
