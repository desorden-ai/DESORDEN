<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#050607" />
  <meta name="robots" content="noindex,nofollow" />
  <title>DESORDEN LAB · SAT</title>
  <link rel="stylesheet" href="/lab/lab.css?v=single-agenda-1" />
</head>
<body>
  <section id="login-screen" class="login-screen">
    <form id="login-form" class="login-card" autocomplete="on">
      <p class="kicker">DESORDEN</p>
      <h1>LAB</h1>
      <p class="muted">Agenda Panasonic · Oficina</p>
      <label>USUARIO<input id="login-user" name="username" autocomplete="username" required /></label>
      <label>CONTRASEÑA<input id="login-pass" name="password" type="password" autocomplete="current-password" required /></label>
      <p id="login-message" class="form-message"></p>
      <button id="login-submit-btn" class="primary" type="submit">ENTRAR</button>
    </form>
  </section>

  <div id="app-shell" class="app-shell" hidden>
    <header class="topbar">
      <div>
        <p class="kicker">DESORDEN LAB</p>
        <h1 id="view-title">AGENDA</h1>
      </div>
      <div class="top-actions">
        <span id="connection-state" class="connection">● CONECTANDO</span>
        <button id="reload-button" class="ghost" type="button">ACTUALIZAR</button>
        <button id="logout-button" class="ghost" type="button">SALIR</button>
      </div>
    </header>

    <nav class="tabs" aria-label="Secciones LAB">
      <button class="tab active" type="button" data-view="agenda">AGENDA</button>
      <button class="tab" type="button" data-view="photos">FOTOS <span id="photos-badge" class="badge" hidden></span></button>
    </nav>

    <main>
      <section data-panel="agenda">
        <div class="metrics">
          <article><span>HOY</span><strong id="metric-today">0</strong></article>
          <article><span>SEMANA</span><strong id="metric-week">0</strong></article>
          <article><span>PENDIENTES</span><strong id="metric-pending">0</strong></article>
          <article><span>FOTOS</span><strong id="metric-photos">0</strong></article>
        </div>

        <div class="agenda-toolbar">
          <div class="week-controls">
            <button id="prev-week" class="ghost" type="button">←</button>
            <button id="this-week" class="ghost" type="button">ESTA SEMANA</button>
            <button id="next-week" class="ghost" type="button">→</button>
          </div>
          <strong id="week-range"></strong>
          <div class="agenda-actions">
            <span id="agenda-status" class="muted"></span>
            <button id="new-job-button" class="primary compact" type="button">+ NUEVO TRABAJO</button>
          </div>
        </div>

        <div id="week-grid" class="week-grid"></div>
      </section>

      <section data-panel="photos" hidden>
        <div class="photos-head">
          <div><p class="kicker">RECIBIDAS DESDE APK</p><h2>FOTOGRAFÍAS</h2></div>
          <input id="photo-search" class="search" placeholder="Buscar SA o nota…" />
        </div>
        <div id="photo-grid" class="photo-grid"></div>
      </section>
    </main>
  </div>

  <dialog id="job-dialog" class="job-dialog">
    <form id="job-form" method="dialog">
      <div class="dialog-head">
        <div><p class="kicker">AGENDA ÚNICA</p><h2 id="job-dialog-title">Nuevo trabajo</h2></div>
        <button class="dialog-close" type="button" data-close="job-dialog">×</button>
      </div>
      <input type="hidden" name="id" />
      <div class="two"><label>FECHA<input type="date" name="date" /></label><label>HORA<input type="time" name="time" /></label></div>
      <label>SA<input name="sa" placeholder="SA-00000" /></label>
      <label>TIPO<select name="type"><option>Avería</option><option>Mantenimiento</option><option>Puesta en marcha</option></select></label>
      <label>CLIENTE<input name="client" /></label>
      <label>TELÉFONO<input name="phone" /></label>
      <label>DIRECCIÓN<input name="address" /></label>
      <label>POBLACIÓN<input name="city" /></label>
      <label>MODELO<input name="model" /></label>
      <div class="two">
        <label>ESTADO<select name="state"><option>Pendiente</option><option>Aceptado</option><option>En curso</option><option>Realizado</option></select></label>
        <label>PRIORIDAD<input name="priority" value="Normal" /></label>
      </div>
      <label>OBSERVACIONES<textarea name="observations"></textarea></label>
      <p id="job-message" class="form-message"></p>
      <button class="primary" type="submit">GUARDAR EN AGENDA</button>
    </form>
  </dialog>

  <div id="global-feedback" class="feedback" hidden><strong id="feedback-title"></strong><span id="feedback-detail"></span></div>
  <script src="/lab/lab.js?v=single-agenda-1" defer></script>
</body>
</html>
