name: Deploy DESORDEN to Cloudflare

on:
  push:
    branches:
      - DESORDEN
  workflow_dispatch:

concurrency:
  group: desorden-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify Cloudflare token
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }

      - name: Install dependencies
        run: npm ci

      - name: Run smoke tests
        run: npm test

      - name: Verify Cloudflare authentication
        run: npx wrangler whoami

      - name: Deploy Worker static assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4.115.0"
          command: deploy --config wrangler.jsonc

      - name: Verify production landing
        shell: bash
        run: |
          for attempt in {1..12}; do
            html="$(curl -fsSL --max-time 20 https://www.desorden.cat/ || true)"
            if grep -q "SI NO ET VEUEN" <<< "$html" && grep -q 'data-n="05"' <<< "$html"; then
              echo "Production verification passed."
              curl -fsSI --max-time 20 https://www.desorden.cat/frames/v1/frame_0001.webp | grep -i "content-type: image/webp"
              curl -fsSI --max-time 20 https://www.desorden.cat/frames/v1/frame_0097.webp | grep -i "content-type: image/webp"
              exit 0
            fi
            echo "Waiting for production propagation ($attempt/12)..."
            sleep 10
          done
          echo "Deployment completed, but production is not serving the expected landing."
          exit 1
