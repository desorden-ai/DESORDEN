<!doctype html>
<html lang="es" class="is-loading">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Experiencia visual interactiva de DESORDEN controlada mediante scroll y gesto táctil."
    />
    <title>DESORDEN.cat — Versión Final Definitiva</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="image"
      href="/frames/v1/frame_0001.webp"
      fetchpriority="high"
    />
    <link
      rel="stylesheet"
      href="/assets/styles.20260730.worker-v4.css"
    />
    <link
      rel="stylesheet"
      href="/assets/touch-drag.20260730.worker-v5.css"
    />
    <link
      rel="stylesheet"
      href="/assets/final.20260730.worker-v7.css"
    />
  </head>
  <body class="is-loading">
    <main
      id="scrollytelling"
      class="scrollytelling"
      aria-busy="true"
    >
      <div id="preloader" class="preloader status-card">
        <div id="loading-state" class="loading-state">
          <h1 class="loading-title">DESORDEN.cat — DEFINITIVO</h1>
          <p id="loading-percent" class="loading-percent">0%</p>
          <p id="loading-detail" class="loading-detail">
            Cargando fotogramas...
          </p>
          <div
            id="progress-track"
            class="progress-track"
            role="progressbar"
            aria-label="Carga de la secuencia"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
          >
            <div id="progress-bar" class="progress-bar"></div>
          </div>
        </div>

        <div id="error-state" class="error-state" role="alert" hidden>
          <p id="error-message">
            No se pudo completar la carga de la secuencia.
          </p>
          <button id="retry-button" class="retry-button" type="button">
            Reintentar
          </button>
        </div>
      </div>

      <div
        id="scroll-container"
        class="scroll-container"
        data-frame-count="97"
      >
        <div id="sticky-stage" class="sticky-stage">
          <div class="video-wrapper">
            <div class="hud-corner hud-top-left" aria-hidden="true"></div>
            <div class="hud-corner hud-top-right" aria-hidden="true"></div>
            <div class="hud-corner hud-bottom-right" aria-hidden="true"></div>

            <div class="hud-rec" aria-hidden="true">
              <span class="hud-rec-dot"></span>
              RAW
            </div>

            <div class="hud-timecode" aria-hidden="true">
              FRM: <span id="tc-counter">001</span>/097
            </div>

            <div id="scale-container" class="scale-container">
              <canvas
                id="sequence-canvas"
                class="sequence-canvas"
                aria-hidden="true"
              ></canvas>
            </div>

            <div class="text-mask-wrapper" aria-hidden="true">
              <div id="text-mover" class="text-mover">
                <div id="cinematic-text" class="cinematic-text">
                  <span class="text-stretch">SI NO TE VEN</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <noscript>
      <style>
        html,
        body {
          overflow: auto !important;
        }

        .preloader {
          display: none !important;
        }
      </style>
      <p class="noscript-message">
        Esta experiencia necesita JavaScript para reproducir la secuencia.
      </p>
    </noscript>

    <script>
      window.__DESORDEN_BOOTED__ = false;
      window.setTimeout(() => {
        if (window.__DESORDEN_BOOTED__) return;

        document.documentElement.classList.add("is-loading");
        document.body.classList.add("is-loading");
        document.getElementById("loading-state").hidden = true;
        document.getElementById("error-state").hidden = false;
        document.getElementById("error-message").textContent =
          "La aplicación no ha podido iniciarse.";
        document
          .getElementById("retry-button")
          .addEventListener("click", () => window.location.reload());
      }, 10000);
    </script>
    <script
      defer
      src="/assets/frame-manifest.20260730.worker-v4.js"
    ></script>
    <script
      defer
      src="/assets/app.20260730.worker-v4.js"
    ></script>
    <script
      defer
      src="/assets/touch-drag.20260730.worker-v5.js"
    ></script>
    <script
      defer
      src="/assets/final.20260730.worker-v7.js"
    ></script>
  </body>
</html>
